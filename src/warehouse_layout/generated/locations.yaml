# Charging docks (Phase 5): the docked and staging poses (IDs in poses), the middle of
# the contact face and of the pedestal face (the dock tag, Phase 7), both on the floor,
# and the keepout zone round the contact bar (in zones).
docks:
  dock_1:
    wall: south
    docked: dock_1_docked
    staging: dock_1_staging
    contact: [10.0, -1.45]
    tag: [10.0, -1.7]
    keepout: dock_1_bar_keepout
  dock_2:
    wall: south
    docked: dock_2_docked
    staging: dock_2_staging
    contact: [11.5, -1.45]
    tag: [11.5, -1.7]
    keepout: dock_2_bar_keepout
  dock_3:
    wall: south
    docked: dock_3_docked
    staging: dock_3_staging
    contact: [13.0, -1.45]
    tag: [13.0, -1.7]
    keepout: dock_3_bar_keepout

# Pick aisle segments (Phases 8 and 11): the floor between the two shelf faces, from end
