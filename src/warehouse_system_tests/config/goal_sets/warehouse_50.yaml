# The frozen goal set of the navigation benchmark (plan stage S3b, decision P3-D22):
# 50 goal poses in the world "warehouse", map frame (x east, y north, yaw counter-
# clockwise from +x; metres, radians). nav_benchmark sends them in this order, and each
# stage drives its own part: S3b goals 1-10, S4 and S6b 1-20, S8b 21-40, and the
# acceptance runs (3a-runs, S9) all 50.
#
# Do not edit this file, and do not write it again to suit a run: runs compare only on
# the same goals. It was written, from the workspace root, by
#   ros2 run warehouse_system_tests goal_set --count 50 --seed 1
# and the same inputs and seed always give the same bytes.
#
# Rules (every goal):
# 1. Its goal circle, 0.556 m round the centre (padded circumscribed radius + 0.10 m),
#    holds only free cells, in the SLAM map and in rasterize's ideal map.
# 2. Its centre is at least 0.95 m from every keepout zone of the layout: the
#    planning core (0.65 m) and its cost ramp (0.30 m) of plan section 3.3.
# 3. Its centre lies in the free space of the robot centre that is connected to the
#    spawn of robot1 (0.0, 0.0), in both maps: cells more than 0.28 m (the padded
#    inscribed radius) from every occupied or unknown cell, outside the 0.65 m cores.
# 4. It is at least 3.0 m from the goal before it (goal 1: from the spawn).
# 5. Its yaw is uniform over a full turn.
# Candidates: x and y uniform over the hall floor (x -1.5 .. 28.5, y -2.0 .. 18.0),
# from Python's random.Random(1).random(), rounded to 1 mm (the yaw to 0.0001 rad)
# before the checks.
#
# Inputs (sha256 of the files under src/):
#   warehouse_layout/config/layout.yaml       0e9ae20f6b606107d7b212a7aad4f113722f604a61eacfdb107f17a27ef1d9eb
#   warehouse_description/config/robot.yaml   4a8100ffca516a8c418fdd4575cb40f9cffcf977e1250ac9463c5bed085c4f19
#   warehouse_navigation/maps/warehouse.yaml  c6bafd1e5e9b4b24b67f7218f687f3d30dfbff3db894e16482609a8e533e52be
#   warehouse_navigation/maps/warehouse.pgm   1de9754dd5ac47ff883278003a796ee93afc2727eed2e697a88656c8ad9b206d
# If one of them changes, a goal may break a rule: write a copy with --out and compare.
# Keep this file unless the owner decides to replace it.

