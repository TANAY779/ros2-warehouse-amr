# slam_toolbox of the warehouse AMR: online asynchronous mapping (plan F5, section 4.4).
#
# This is slam_toolbox 2.8.5's own sample, config/mapper_params_online_async.yaml, with each
# change marked "changed" or "added" (plan P2-D14: start from upstream, change with evidence).
# Every key is spelled out on purpose. A key left out does not fall back to the sample's value
# but to the value built into the node, and several of those differ from the sample: for
# example minimum_distance_penalty is 0.05 built in and 0.5 in the sample, transform_timeout
# 0.5 s and 0.2 s.
#
# Removed from the sample: min_laser_range. slam_toolbox 2.8.5 never reads it (it appears in
# no source file and no library). The shortest range it uses is each scan's range_min, which
# robot.yaml sets through the URDF (0.10 m).
#
# The key starts with /**/ so it matches the node in any namespace (/robot1/slam_toolbox); the
# sample's plain `slam_toolbox:` matches only a node in /.
#
# slam_toolbox publishes map -> odom on the robot's tf, the EKF odom -> base_footprint.
/**/slam_toolbox:
  ros__parameters:
    # Plugin parameters: the Ceres optimizer that corrects the pose graph after a loop closure.
    solver_plugin: solver_plugins::CeresSolver
    ceres_linear_solver: SPARSE_NORMAL_CHOLESKY
    ceres_preconditioner: SCHUR_JACOBI
    ceres_trust_strategy: LEVENBERG_MARQUARDT
    ceres_dogleg_type: TRADITIONAL_DOGLEG
    ceres_loss_function: None
    # Read by the Ceres plugin only. Which node runs (async_slam_toolbox_node) decides that
    # slam_toolbox maps.
    mode: mapping

    # ROS parameters
    odom_frame: odom
    map_frame: map
    base_frame: base_footprint
    scan_topic: scan               # changed from /scan: relative, so it resolves in the robot's namespace
    map_name: /map                 # added (= built in): absolute on purpose, one map for all robots (plan §2.3)
    use_map_saver: false           # changed from true: maps are saved with nav2's map_saver_cli
    use_lifecycle_manager: false   # added (= built in): slam.launch.py activates it with launch events, no bond (P2-D8)
    debug_logging: false
    throttle_scans: 1
    transform_publish_period: 0.02  # s: map -> odom at 50 Hz
    map_update_interval: 2.0       # changed from 5.0 s: the map grows smoothly in RViz and in the time-lapse
    resolution: 0.05               # m per cell
    restamp_tf: false
    max_laser_range: 20.0          # m, = robot.yaml lidar_front.range_max (test_nav_params.py checks it)
    minimum_time_interval: 0.5     # s
    transform_timeout: 0.2         # s
    tf_buffer_duration: 30.0       # s
    stack_size_to_use: 40000000    # bytes: serializing a large map needs a large stack
    enable_interactive_mode: false  # changed from true: no interactive markers for editing the graph

    # General parameters
    use_scan_matching: true
    use_scan_barycenter: true
    minimum_travel_distance: 0.3   # changed from 0.5 m: more graph nodes in the 4-5 m aisles
    minimum_travel_heading: 0.3    # changed from 0.5 rad
    check_min_dist_and_heading_precisely: false
    scan_buffer_size: 10
    scan_buffer_maximum_scan_distance: 10.0
    link_match_minimum_response_fine: 0.1
    link_scan_maximum_distance: 1.5
    loop_search_maximum_distance: 2.0  # changed from 3.0 m, which reaches into the next aisle 2.7 m away (risk R2-1)
    do_loop_closing: true
    loop_match_minimum_chain_size: 10
    loop_match_maximum_variance_coarse: 3.0
    loop_match_minimum_response_coarse: 0.35
    loop_match_minimum_response_fine: 0.5  # changed from 0.45: fewer false loop closures between look-alike aisles

    # Correlation parameters
    correlation_search_space_dimension: 0.5
    correlation_search_space_resolution: 0.01
    correlation_search_space_smear_deviation: 0.1

    # Correlation parameters for loop closure
    loop_search_space_dimension: 8.0
    loop_search_space_resolution: 0.05
    loop_search_space_smear_deviation: 0.03

    # Scan matcher parameters
    distance_variance_penalty: 0.5
    angle_variance_penalty: 1.0
    fine_search_angle_offset: 0.00349
    coarse_search_angle_offset: 0.349
    coarse_angle_resolution: 0.0349
    minimum_angle_penalty: 0.9
    minimum_distance_penalty: 0.5
    use_response_expansion: true
    min_pass_through: 2
    occupancy_threshold: 0.1
